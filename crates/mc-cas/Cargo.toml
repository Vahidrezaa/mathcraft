[package]
name = "mc-cas"
description = "MathCraft symbolic engine: exact arithmetic (pure-Rust num-bigint/num-rational — CAS-0 decision, doc 05 §2), full diff + numeric self-check, expand/collect/simplify normal forms, LaTeX writer, S-expr serde, e-graph rewriting behind the `egraph` feature (doc 05)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
# موتور e-graph (سند ۰۵ §۳ سطح ۱) — egg اختیاری؛ پیش‌فرض خاموش تا
# بیلد پایه دست‌نخورده بماند (ریسک ROADMAP 4.2). CI جداگانه روشنش می‌کند.
egraph = ["dep:egg"]

[dependencies]
num-bigint.workspace = true
num-rational.workspace = true
num-traits.workspace = true
egg = { version = "0.9", optional = true }
