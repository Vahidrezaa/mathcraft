# CI — MathCraft (doc 07): fmt/clippy/test/deny + Octave differential + Flutter analyze/test
# APK build moves to the release workflow at P6 (base CI budget).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt + clippy + test + deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (strict)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Panic audit — no todo!/unimplemented!/panic!/unwrap/expect in non-test product code (doc 08 §1, ROADMAP 2.5)
        run: |
          # frb_generated.rs is FRB-generated output and is exempt (doc 08 §1);
          # #[cfg(test)] modules are stripped (brace-matched) before scanning.
          python3 scripts/panic_audit.py

      - name: cargo-deny (licenses + advisories — doc 02 §8)
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny check licenses advisories

  flutter:
    name: Flutter (analyze + test, with FRB codegen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (needed by flutter_rust_bridge_codegen)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install flutter_rust_bridge_codegen (pinned = runtime version)
        # codegen must equal the runtime version in Cargo.lock/pubspec (2.12.0).
        # Unpinned, a newer codegen (e.g. 2.13.0) silently runs `flutter pub add`
        # during generate and produces mismatched glue.
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5  # pinned = locally-validated version (deliberate bump later, P6)

      - name: Pub get
        run: |
          cd app
          flutter pub get

      - name: FRB codegen (generates lib/src/rust/)
        # app/flutter_rust_bridge.yaml is only found from CWD=app;
        # running from repo root => "Please provide rust_input" panic.
        run: |
          cd app
          flutter_rust_bridge_codegen generate

      - name: Glue is up to date (no diff after codegen)
        run: |
          if ! git diff --exit-code -- app/lib/src/rust crates/mc-ffi/src/frb_generated.rs; then
            echo "::error::FRB glue is stale - regenerate and commit"
            exit 1
          fi

      - name: Analyze
        run: |
          cd app
          flutter analyze --fatal-infos

      - name: Widget tests (FakeEngineClient — no .so needed, doc 08 §6)
        run: |
          cd app
          flutter test

  octave-differential:
    name: Octave differential (corpus P1 — doc 08 §2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Octave
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends octave

      - name: Regenerate corpus output with Octave
        run: octave --no-gui --eval "run('test-corpus/octave_regen.m')"

      - name: Compare Octave vs expected (tol per case — default 1e-9)
        run: python3 scripts/compare_expected.py
