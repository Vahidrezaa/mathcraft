# CI پایه P0 — سند ۰۷: fmt/clippy/test/deny + Flutter analyze/test
# بیلد APK اندروید از P6 به release workflow منتقل می‌شود (بودجه CI پایه).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt + clippy + test + deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (strict)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: No todo!/unimplemented! in hand-written product code (doc 08 §1)
        run: |
          # frb_generated.rs خروجی اتوژنریت FRB است و مستثناست (سند ۰۸ §1)
          if grep -rn -E "todo!|unimplemented!" crates/*/src --exclude='frb_generated*.rs'; then
            echo "::error::todo!/unimplemented! is forbidden in hand-written code"
            exit 1
          fi

      - name: cargo-deny (licenses + advisories — doc 02 §8)
        run: |
          cargo install cargo-deny --locked
          cargo deny check licenses advisories

  flutter:
    name: Flutter (analyze + test, with FRB codegen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (needed by flutter_rust_bridge_codegen)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --locked

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Pub get
        run: |
          cd app
          flutter pub get

      - name: FRB codegen (generates lib/src/rust/)
        run: flutter_rust_bridge_codegen generate

      - name: Analyze
        run: |
          cd app
          flutter analyze --fatal-infos

      - name: Widget tests (FakeEngineClient — no .so needed, doc 08 §6)
        run: |
          cd app
          flutter test

  octave-differential:
    name: Octave differential (corpus P1 — doc 08 §2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Octave
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends octave

      - name: Regenerate corpus output with Octave
        run: octave --no-gui --eval "run('test-corpus/octave_regen.m')"

      - name: Compare Octave vs expected (tol per case — default 1e-9)
        run: python3 scripts/compare_expected.py
