# Android pipeline — engine .so (cargo-ndk) + Flutter gates + installable APK
# (doc 02 s8, doc 07, doc 09 s2/s8: path D — GitHub Actions is the main build line).
# Every push to main / manual dispatch produces a debug-signed release APK
# (split per ABI) as the "MathCraft-APK" artifact — installable for testing.
# The formal release workflow (own keystore, changelog, F-Droid) stays at P6 (doc 07).
# NOTE: mirrors scripts/ci-build-apk.sh — every command here is validated locally
# against Flutter 3.24.5 / JDK 17 / NDK r27c / cargo-ndk 4.1.2 before shipping.
name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  engine-and-flutter:
    name: libmathcraft.so + analyze/test + release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2

      - name: Install pinned build tools
        # cargo-ndk 4.x: -t takes Android ABI names and -P is the API level;
        # the old `-p mc-ffi` before `build` was forwarded to cargo and broke CI.
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked

      - name: Locate NDK (preinstalled on ubuntu-latest)
        run: |
          test -d "$ANDROID_NDK_LATEST_HOME" || { echo "::error::ANDROID_NDK_LATEST_HOME missing"; exit 1; }
          echo "NDK_PATH=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5  # pinned = locally-validated version

      - name: Pin JDK 17 for Gradle (AGP 8.x / Gradle 8.3 do not run on newer JDKs)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pub get
        run: |
          cd app
          flutter pub get

      - name: FRB codegen (from app/ — config lives there)
        run: |
          cd app
          flutter_rust_bridge_codegen generate

      - name: Glue is up to date (no diff after codegen)
        run: |
          if ! git diff --exit-code -- app/lib/src/rust crates/mc-ffi/src/frb_generated.rs; then
            echo "::error::FRB glue is stale - regenerate and commit"
            exit 1
          fi

      - name: build_runner (freezed — doc 02 s3.5)
        run: |
          cd app
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: |
          cd app
          flutter analyze --fatal-infos

      - name: Widget tests (FakeEngineClient — no .so needed, doc 08 s6)
        run: |
          cd app
          flutter test

      - name: Build engine .so + release APK (ci-build-apk.sh — single source of truth)
        env:
          ANDROID_NDK_HOME: ${{ env.NDK_PATH }}
        run: APK_MODE=release bash scripts/ci-build-apk.sh

      - name: Upload jniLibs artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmathcraft-jniLibs
          path: app/android/app/src/main/jniLibs/
          if-no-files-found: error

      - name: Upload APK artifact (debug-signed release, split per ABI)
        uses: actions/upload-artifact@v4
        with:
          name: MathCraft-APK
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
