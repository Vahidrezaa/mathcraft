name: mathcraft
description: "MathCraft — offline-first engineering computation (MATLAB subset for terms 1-2). Rust engine + Flutter UI."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  # قرارداد موتور (سند ۰۲ بخش ۳) — فقط نسخه ۲
  flutter_rust_bridge: ">=2.6.0 <3.0.0"
  # State (سند ۰۲ بخش ۱: Riverpod)
  flutter_riverpod: ">=2.5.0 <3.0.0"
  # رندر Craft Icons (SVG اختصاصی — سند ۰۶ بخش ۲.۵؛ ایموجی ممنوع)
  flutter_svg: ">=2.0.0 <3.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
