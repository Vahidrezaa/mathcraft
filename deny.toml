# cargo-deny — قواعد وابستگی (سند ۰۲ بخش ۲ بند enforce، سند ۰۲ بخش ۸)
# پروژه GPL-3.0-or-later است (تصمیم D-08)؛ همه لایسنس‌های سازگار با GPL مجازند.

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "Unlicense",
  "BSL-1.0",
  "OpenSSL",
  # خود پروژه و وابستگی‌های سازگار (GMP/rug در P4: LGPL-3.0 سازگار با GPL-3 است)
  "GPL-3.0-or-later",
  "GPL-3.0-only",
  "GPL-2.0-or-later",
  "LGPL-3.0-or-later",
]
confidence-threshold = 0.93

[advisories]
version = 2
yanked = "warn"

[bans]
multiple-versions = "warn"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
