# cargo-deny — dependency rules (doc 02 §2 enforce, doc 02 §8)
# The project is GPL-3.0-or-later (decision D-08); every GPL-compatible license is allowed.
# The allow list below = licenses ACTUALLY present in Cargo.lock, verified with
# cargo-deny 0.20.2 — entries that are never matched only produce warning noise.
# When a new dependency brings a GPL-compatible license, add it here deliberately.

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "Unicode-3.0",
  "Zlib",
  "Unlicense",
  # The project itself + GPL-compatible deps (LGPL-3.0 for rug/GMP lands in P4)
  "GPL-3.0-or-later",
]
confidence-threshold = 0.93

[advisories]
version = 2
yanked = "warn"
ignore = [
  # RUSTSEC-2024-0436 — `paste` is UNMAINTAINED (archived), not vulnerable.
  # Transitive path: faer 0.22.6 -> gemm 0.18.x -> paste. Upstream says "no safe
  # upgrade"; dropping it lands with faer/gemm updates (watchlist in STATUS.md).
  "RUSTSEC-2024-0436",
]

[bans]
multiple-versions = "warn"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
